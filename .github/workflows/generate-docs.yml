name: generate-docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-docx
      - run: python3 runner.py
      - name: Collect files
        run: |
          mkdir -p festival_docs
          mv -f *.docx festival_docs/
      - uses: actions/upload-artifact@v4
        with:
          name: festival-docs
          path: festival_docs/
      - name: Commit generated docx
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add festival_docs
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Generate festival docx [skip ci]"; git push; fi
